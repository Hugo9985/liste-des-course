<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courses Ensemble</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Courses">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#14221a;--mu:#6b7a72;--pr:#16a34a;--rd:#dc2626;--bd:#e0e8e3}
@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#18231d;--tx:#e8f1ec;--mu:#8ea397;--bd:#27362d}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:12px}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:1.4rem;margin:8px 0 12px} h2{font-size:1.05rem;margin:0 0 10px}
input[type=text],input[type=email],input[type=password],select{width:100%;padding:12px;margin:0 0 8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--pr);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--bd);color:var(--tx)} button.full{width:100%}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1;background:var(--bd);color:var(--tx)}.tabs button.on{background:var(--pr);color:#fff}
.bar{display:flex;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.bar select{margin:0;flex:1}.bar button{padding:10px 12px}
.row{display:flex;gap:8px;align-items:center}.row input[type=text]{margin:0;flex:1}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--mu)}.chk input{width:20px;height:20px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
li.urgent{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 9%,var(--card));border-left:5px solid var(--rd)}
li.done .t{text-decoration:line-through;opacity:.5}
li input{width:22px;height:22px;flex:none}
.body{flex:1;min-width:0}.t{word-break:break-word}.by{font-size:.8rem;color:var(--mu)}
.badge{background:var(--rd);color:#fff;font-size:.7rem;font-weight:700;border-radius:6px;padding:2px 6px;margin-right:6px}
.del{background:none;color:var(--mu);padding:6px 10px;font-size:1.1rem}
.err{color:var(--rd);min-height:1.2em;font-size:.9rem}.mu{color:var(--mu);font-size:.9rem}
#install{background:var(--pr);color:#fff;text-align:center}
</style>
</head>
<body>
<main>
<section id="auth" class="hidden">
  <h1>🛒 Courses Ensemble</h1>
  <div class="card">
    <div class="tabs"><button id="tabIn" class="on">Connexion</button><button id="tabUp">Inscription</button></div>
    <input id="aName" type="text" placeholder="Nom / Pseudo" class="hidden" autocomplete="nickname">
    <input id="aEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="aPass" type="password" placeholder="Mot de passe (6 car. min.)" autocomplete="current-password">
    <p class="mu">✔ Vous restez connecté, même après fermeture de l'app.</p>
    <button id="aGo" class="full">Se connecter</button>
    <p id="aErr" class="err"></p>
  </div>
</section>

<section id="app" class="hidden">
  <div class="bar">
    <select id="gSel"></select>
    <button id="gMenu" class="sec" title="Groupes">👥</button>
    <button id="bell" class="sec hidden" title="Activer les notifications">🔔</button>
    <button id="out" class="sec" title="Déconnexion">⏻</button>
  </div>
  <div id="install" class="card hidden"></div>

  <div id="groups" class="hidden">
    <div class="card"><h2>Créer un groupe</h2>
      <input id="cName" type="text" placeholder="Nom du groupe">
      <input id="cPass" type="password" placeholder="Mot de passe (optionnel)">
      <button id="cGo" class="full">Créer</button></div>
    <div class="card"><h2>Rejoindre un groupe</h2>
      <input id="jName" type="text" placeholder="Nom du groupe">
      <input id="jPass" type="password" placeholder="Mot de passe (si requis)">
      <button id="jGo" class="full">Rejoindre</button></div>
    <p id="gErr" class="err"></p>
  </div>

  <div id="list" class="hidden">
    <div class="card">
      <div class="row"><input id="iText" type="text" placeholder="Ajouter un article…" maxlength="120"><button id="iGo">＋</button></div>
      <label class="chk"><input id="iUrg" type="checkbox"> 🔴 Urgent (prévient le groupe)</label>
    </div>
    <ul id="items"></ul>
    <p id="empty" class="mu hidden" style="text-align:center">Liste vide 🎉</p>
  </div>
</section>
</main>

<script src="/config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show = (id, on) => $(id).classList.toggle('hidden', !on);
const gerr = (m) => ($('#gErr').textContent = m || '');

// Session persistante dans localStorage = connexion automatique
const sb = createClient(APP.supabaseUrl, APP.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

let user, groups = [], gid = localStorage.getItem('gid'), chan, mode = 'in';
const myName = () => user?.user_metadata?.name || 'Anonyme';

// ---------- AUTH ----------
function setMode(m) {
  mode = m; $('#tabIn').classList.toggle('on', m === 'in'); $('#tabUp').classList.toggle('on', m === 'up');
  show('#aName', m === 'up'); $('#aGo').textContent = m === 'in' ? 'Se connecter' : 'Créer mon compte'; $('#aErr').textContent = '';
}
$('#tabIn').onclick = () => setMode('in'); $('#tabUp').onclick = () => setMode('up');
$('#aGo').onclick = async () => {
  const email = $('#aEmail').value.trim(), password = $('#aPass').value, name = $('#aName').value.trim(), err = $('#aErr');
  err.textContent = '';
  if (mode === 'up') {
    if (!name) return (err.textContent = 'Entrez un pseudo.');
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name } } });
    if (error) return (err.textContent = error.message);
    if (!data.session) err.textContent = '✉️ Compte créé : confirmez votre email puis connectez-vous.';
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) err.textContent = error.message.includes('Invalid') ? 'Email ou mot de passe incorrect.' : error.message;
  }
};
$('#out').onclick = async () => {
  try { const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
    if (sub) await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); } catch (_) {}
  sb.auth.signOut();
};

sb.auth.onAuthStateChange((_ev, session) => {
  const u = session?.user || null;
  if ((u?.id || null) === (user?.id || null) && user !== undefined) { user = u; return; }
  user = u; setTimeout(onUser, 0);
});
user = undefined;

function onUser() {
  if (chan) { sb.removeChannel(chan); chan = null; }
  if (!user) { show('#app', false); show('#auth', true); return; }
  show('#auth', false); show('#app', true);
  loadGroups(); initPush();
  // Temps réel : la RLS ne transmet que les articles de nos groupes
  chan = sb.channel('items-live').on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, () => loadItems()).subscribe();
}

// ---------- GROUPES ----------
async function loadGroups(selectId) {
  const { data } = await sb.from('group_members').select('groups(id,name)').eq('user_id', user.id);
  groups = (data || []).map((r) => r.groups).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
  if (selectId) gid = selectId;
  if (!groups.find((g) => g.id === gid)) gid = groups[0]?.id || null;
  $('#gSel').innerHTML = groups.map((g) => `<option value="${g.id}" ${g.id === gid ? 'selected' : ''}>${esc(g.name)}</option>`).join('');
  show('#gSel', groups.length > 0);
  if (!groups.length) { show('#groups', true); show('#list', false); }
  else if (selectId) { show('#groups', false); show('#list', true); }
  else show('#list', $('#groups').classList.contains('hidden'));
  loadItems();
}
$('#gSel').onchange = (e) => { gid = e.target.value; loadItems(); };
$('#gMenu').onclick = () => { const o = $('#groups').classList.contains('hidden'); show('#groups', o); show('#list', !o && !!gid); };

$('#cGo').onclick = async () => {
  const { data, error } = await sb.rpc('create_group', { p_name: $('#cName').value, p_password: $('#cPass').value });
  if (error) return gerr(error.message);
  $('#cName').value = $('#cPass').value = ''; gerr(); loadGroups(data);
};
$('#jGo').onclick = async () => {
  const { data, error } = await sb.rpc('join_group', { p_name: $('#jName').value, p_password: $('#jPass').value });
  if (error) return gerr(error.message);
  $('#jName').value = $('#jPass').value = ''; gerr(); loadGroups(data);
};

// ---------- LISTE ----------
async function loadItems() {
  if (!gid) { $('#items').innerHTML = ''; return; }
  localStorage.setItem('gid', gid);
  const { data } = await sb.from('items').select('*').eq('group_id', gid).order('created_at', { ascending: false });
  const items = (data || []).sort((a, b) => (a.done - b.done) || (b.urgent - a.urgent)); // urgents en tête
  $('#items').innerHTML = items.map((i) => `
    <li class="${i.urgent && !i.done ? 'urgent' : ''} ${i.done ? 'done' : ''}" data-id="${i.id}">
      <input type="checkbox" ${i.done ? 'checked' : ''} aria-label="Acheté">
      <div class="body"><div class="t">${i.urgent ? '<span class="badge">🔴 URGENT</span>' : ''}${esc(i.text)}</div>
      <div class="by">Ajouté par ${esc(i.author_name)}</div></div>
      <button class="del" aria-label="Supprimer">🗑</button></li>`).join('');
  show('#empty', !items.length);
}
$('#items').onclick = async (e) => {
  const li = e.target.closest('li'); if (!li) return;
  if (e.target.matches('input')) await sb.from('items').update({ done: e.target.checked }).eq('id', li.dataset.id);
  else if (e.target.closest('.del')) await sb.from('items').delete().eq('id', li.dataset.id);
  loadItems();
};
async function addItem() {
  const text = $('#iText').value.trim(); if (!text || !gid) return;
  const { error } = await sb.from('items').insert({ group_id: gid, text, urgent: $('#iUrg').checked, author_id: user.id, author_name: myName() });
  if (error) return alert(error.message);
  $('#iText').value = ''; $('#iUrg').checked = false; $('#iText').focus(); loadItems();
}
$('#iGo').onclick = addItem; $('#iText').onkeydown = (e) => e.key === 'Enter' && addItem();

// ---------- NOTIFICATIONS PUSH ----------
const b64 = (s) => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
const pushOK = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function initPush() {
  if (!pushOK()) return;
  if (Notification.permission === 'granted') savePush(); else if (Notification.permission === 'default') show('#bell', true);
}
async function savePush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(APP.vapidPublicKey) });
    await sb.from('push_subscriptions').upsert({ user_id: user.id, endpoint: sub.endpoint, subscription: sub.toJSON() }, { onConflict: 'endpoint' });
  } catch (e) { console.warn('Push:', e); }
}
$('#bell').onclick = async () => { // geste utilisateur obligatoire (iOS)
  if (await Notification.requestPermission() === 'granted') { show('#bell', false); savePush(); }
};

// ---------- AIDE INSTALLATION ----------
if (!(matchMedia('(display-mode: standalone)').matches || navigator.standalone)) {
  const box = $('#install');
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) { box.innerHTML = 'Pour installer : <b>Partager ⬆️</b> puis <b>« Sur l\'écran d\'accueil »</b>'; show('#install', true); }
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); box.innerHTML = '<b>📲 Installer l\'application</b>'; box.onclick = () => e.prompt(); show('#install', true); });
}
</script>
</body>
</html>
