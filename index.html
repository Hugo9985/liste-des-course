<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courses Ensemble</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Courses">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#14221a;--mu:#6b7a72;--pr:#16a34a;--rd:#dc2626;--bd:#e0e8e3}
@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#18231d;--tx:#e8f1ec;--mu:#8ea397;--bd:#27362d}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:12px}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:1.4rem;margin:8px 0 12px} h2{font-size:1.05rem;margin:0 0 10px}
input[type=text],input[type=email],input[type=password],select{width:100%;padding:12px;margin:0 0 8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--pr);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--bd);color:var(--tx)} button.full{width:100%}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1;background:var(--bd);color:var(--tx)}.tabs button.on{background:var(--pr);color:#fff}
.bar{display:flex;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.bar select{margin:0;flex:1}.bar button{padding:10px 12px}
.row{display:flex;gap:8px;align-items:center}.row input[type=text]{margin:0;flex:1}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--mu)}
.chk input{width:20px;height:20px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
li.urgent{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 9%,var(--card));border-left:5px solid var(--rd)}
li.done .t{text-decoration:line-through;opacity:.5}
li input{width:22px;height:22px;flex:none}
.body{flex:1;min-width:0}.t{word-break:break-word}.by{font-size:.8rem;color:var(--mu)}
.badge{background:var(--rd);color:#fff;font-size:.7rem;font-weight:700;border-radius:6px;padding:2px 6px;margin-right:6px}
.del{background:none;color:var(--mu);padding:6px 10px;font-size:1.1rem}
.err{color:var(--rd);min-height:1.2em;font-size:.9rem}.mu{color:var(--mu);font-size:.9rem}
#install{background:var(--pr);color:#fff;text-align:center}
</style>
</head>
<body>
<main>

<!-- AUTH -->
<section id="auth" class="hidden">
  <h1>🛒 Courses Ensemble</h1>
  <div class="card">
    <div class="tabs"><button id="tabIn" class="on">Connexion</button><button id="tabUp">Inscription</button></div>
    <input id="aName" type="text" placeholder="Nom / Pseudo" class="hidden" autocomplete="nickname">
    <input id="aEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="aPass" type="password" placeholder="Mot de passe (6 car. min.)" autocomplete="current-password">
    <p class="mu">✔ Vous restez connecté, même après fermeture de l'app.</p>
    <button id="aGo" class="full">Se connecter</button>
    <p id="aErr" class="err"></p>
  </div>
</section>

<!-- APP -->
<section id="app" class="hidden">
  <div class="bar">
    <select id="gSel"></select>
    <button id="gMenu" class="sec" title="Groupes">👥</button>
    <button id="bell" class="sec hidden" title="Notifications">🔔</button>
    <button id="out" class="sec" title="Déconnexion">⏻</button>
  </div>
  <div id="install" class="card hidden"></div>

  <div id="groups" class="hidden">
    <div class="card"><h2>Créer un groupe</h2>
      <input id="cName" type="text" placeholder="Nom du groupe">
      <input id="cPass" type="password" placeholder="Mot de passe (optionnel)">
      <button id="cGo" class="full">Créer</button></div>
    <div class="card"><h2>Rejoindre un groupe</h2>
      <input id="jName" type="text" placeholder="Nom du groupe">
      <input id="jPass" type="password" placeholder="Mot de passe (si requis)">
      <button id="jGo" class="full">Rejoindre</button></div>
    <p id="gErr" class="err"></p>
  </div>

  <div id="list" class="hidden">
    <div class="card">
      <div class="row"><input id="iText" type="text" placeholder="Ajouter un article…" maxlength="120">
      <button id="iGo">＋</button></div>
      <label class="chk"><input id="iUrg" type="checkbox"> 🔴 Urgent (prévient le groupe)</label>
    </div>
    <ul id="items"></ul>
    <p id="empty" class="mu hidden" style="text-align:center">Liste vide 🎉</p>
  </div>
</section>

</main>

<script src="/config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, updateProfile, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot,
  query, where, orderBy, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getMessaging, getToken, isSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = (n) => n.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const sha = async (p, salt) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + p)))].map((x) => x.toString(16).padStart(2, '0')).join('');
const show = (id, on) => $(id).classList.toggle('hidden', !on);

const app = initializeApp(APP.firebase);
const auth = getAuth(app), db = getFirestore(app);
await setPersistence(auth, browserLocalPersistence); // connexion automatique

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

let mode = 'in', uid = null, groups = [], gid = localStorage.getItem('gid'), unsubG, unsubI;

// ---------- AUTH ----------
function setMode(m) {
  mode = m; $('#tabIn').classList.toggle('on', m === 'in'); $('#tabUp').classList.toggle('on', m === 'up');
  show('#aName', m === 'up'); $('#aGo').textContent = m === 'in' ? 'Se connecter' : 'Créer mon compte'; $('#aErr').textContent = '';
}
$('#tabIn').onclick = () => setMode('in'); $('#tabUp').onclick = () => setMode('up');
$('#aGo').onclick = async () => {
  const email = $('#aEmail').value.trim(), pass = $('#aPass').value, name = $('#aName').value.trim();
  try {
    if (mode === 'up') {
      if (!name) throw { code: 'pseudo' };
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(c.user, { displayName: name });
      await setDoc(doc(db, 'users', c.user.uid), { name }, { merge: true });
    } else await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    const m = { 'auth/invalid-credential': 'Email ou mot de passe incorrect.', 'auth/email-already-in-use': 'Email déjà utilisé.',
      'auth/weak-password': 'Mot de passe trop court (6 min.).', 'auth/invalid-email': 'Email invalide.', pseudo: 'Entrez un pseudo.' };
    $('#aErr').textContent = m[e.code] || e.message;
  }
};
$('#out').onclick = () => signOut(auth);

onAuthStateChanged(auth, (u) => {
  unsubG?.(); unsubI?.();
  if (!u) { uid = null; show('#app', false); show('#auth', true); return; }
  uid = u.uid; show('#auth', false); show('#app', true);
  watchGroups(); initPush();
});

// ---------- GROUPES ----------
function watchGroups() {
  unsubG = onSnapshot(query(collection(db, 'groups'), where('members', 'array-contains', uid)), (snap) => {
    groups = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
    if (!groups.find((g) => g.id === gid)) gid = groups[0]?.id || null;
    $('#gSel').innerHTML = groups.map((g) => `<option value="${esc(g.id)}" ${g.id === gid ? 'selected' : ''}>${esc(g.name)}</option>`).join('');
    if (!groups.length) { show('#groups', true); show('#list', false); show('#gSel', false); }
    else { show('#gSel', true); show('#list', !$('#groups').classList.contains('hidden') ? false : true); watchItems(); }
  });
}
$('#gSel').onchange = (e) => { gid = e.target.value; watchItems(); };
$('#gMenu').onclick = () => { const o = $('#groups').classList.contains('hidden'); show('#groups', o); show('#list', !o && !!gid); };
const gerr = (m) => ($('#gErr').textContent = m);

$('#cGo').onclick = async () => {
  const name = $('#cName').value.trim(), pass = $('#cPass').value, id = slug(name);
  if (!id) return gerr('Nom de groupe invalide.');
  try {
    if ((await getDoc(doc(db, 'groups', id))).exists()) return gerr('Ce nom de groupe existe déjà.');
    const salt = crypto.randomUUID(), data = { name, members: [uid], ownerId: uid, createdAt: serverTimestamp(), salt, passHash: pass ? await sha(pass, salt) : null };
    await setDoc(doc(db, 'groups', id), data);
    gid = id; localStorage.setItem('gid', id); $('#cName').value = $('#cPass').value = ''; gerr(''); show('#groups', false); show('#list', true);
  } catch (e) { gerr(e.message); }
};
$('#jGo').onclick = async () => {
  const id = slug($('#jName').value), pass = $('#jPass').value;
  try {
    const s = await getDoc(doc(db, 'groups', id));
    if (!id || !s.exists()) return gerr('Groupe introuvable.');
    const g = s.data();
    if (g.members.includes(uid)) { gid = id; show('#groups', false); show('#list', true); return watchItems(); }
    if (g.passHash && (await sha(pass, g.salt)) !== g.passHash) return gerr('Mot de passe incorrect.');
    await updateDoc(doc(db, 'groups', id), { members: arrayUnion(uid) });
    gid = id; localStorage.setItem('gid', id); $('#jName').value = $('#jPass').value = ''; gerr(''); show('#groups', false); show('#list', true);
  } catch (e) { gerr(e.message); }
};

// ---------- LISTE TEMPS RÉEL ----------
function watchItems() {
  unsubI?.(); if (!gid) return; localStorage.setItem('gid', gid);
  unsubI = onSnapshot(query(collection(db, 'groups', gid, 'items'), orderBy('createdAt', 'desc')), (snap) => {
    const items = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.done - b.done) || (b.urgent - a.urgent)); // à acheter d'abord, urgents en tête
    $('#items').innerHTML = items.map((i) => `
      <li class="${i.urgent && !i.done ? 'urgent' : ''} ${i.done ? 'done' : ''}" data-id="${i.id}">
        <input type="checkbox" ${i.done ? 'checked' : ''} aria-label="Acheté">
        <div class="body"><div class="t">${i.urgent ? '<span class="badge">🔴 URGENT</span>' : ''}${esc(i.text)}</div>
        <div class="by">Ajouté par ${esc(i.authorName)}</div></div>
        <button class="del" aria-label="Supprimer">🗑</button></li>`).join('');
    show('#empty', !items.length);
  });
}
$('#items').onclick = async (e) => {
  const li = e.target.closest('li'); if (!li) return; const ref = doc(db, 'groups', gid, 'items', li.dataset.id);
  if (e.target.matches('input')) await updateDoc(ref, { done: e.target.checked });
  else if (e.target.closest('.del')) await deleteDoc(ref);
};
async function addItem() {
  const text = $('#iText').value.trim(); if (!text || !gid) return;
  await addDoc(collection(db, 'groups', gid, 'items'), {
    text, urgent: $('#iUrg').checked, done: false, authorId: uid,
    authorName: auth.currentUser.displayName || 'Anonyme', createdAt: serverTimestamp()
  });
  $('#iText').value = ''; $('#iUrg').checked = false; $('#iText').focus();
}
$('#iGo').onclick = addItem; $('#iText').onkeydown = (e) => e.key === 'Enter' && addItem();

// ---------- NOTIFICATIONS PUSH ----------
async function initPush() {
  if (!(await isSupported().catch(() => false))) return;
  if (Notification.permission === 'granted') return saveToken();
  if (Notification.permission === 'default') show('#bell', true);
}
async function saveToken() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const token = await getToken(getMessaging(app), { vapidKey: APP.vapidKey, serviceWorkerRegistration: reg });
    if (token) await setDoc(doc(db, 'users', uid), { tokens: arrayUnion(token), name: auth.currentUser.displayName || '' }, { merge: true });
  } catch (e) { console.warn('Push:', e); }
}
$('#bell').onclick = async () => { // geste utilisateur obligatoire sur iOS
  if (await Notification.requestPermission() === 'granted') { show('#bell', false); saveToken(); }
};

// ---------- AIDE INSTALLATION ----------
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (!standalone) {
  const box = $('#install'); let dp;
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
    box.innerHTML = 'Pour installer : appuyez sur <b>Partager ⬆️</b> puis <b>« Sur l\'écran d\'accueil »</b>'; show('#install', true);
  }
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); dp = e;
    box.innerHTML = '<b>📲 Installer l\'application</b>'; box.onclick = () => dp.prompt(); show('#install', true); });
}
</script>
</body>
</html>
